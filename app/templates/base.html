<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>{{ title or "SprintFlow" }}</title>
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <div class="topbar">
            <div class="brand">SprintFlow</div>
            {% if user %}
            <form method="post" action="/ui/logout">
                <button type="submit">Logout</button>
            </form>
            {% endif %}
        </div>

        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
