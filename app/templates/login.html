{% extends "base.html" %}
{% block content %}
<h1>Login</h1>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/ui/login">
    <label>Email</label>
    <input name="email" type="email" required />

    <label>Password</label>
    <input name="password" type="password" required />

    <button type="submit">Sign in</button>
</form>
{% endblock %}
